[project]
name = "translator"
version = "0.2.0"
description = "Real-time in-game translation: screen OCR + teammate voice"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
screen = ["mss>=9.0", "bettercam>=0.1.0; sys_platform == 'win32'"]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.9"]
translate = ["httpx>=0.27"]
asr = ["faster-whisper>=1.0"]
audio = ["sounddevice>=0.4"]
ui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
translator = "translator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: waits in real time or loads real ONNX models; skipped unless --runslow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
