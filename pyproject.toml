[project]
name = "fps-translator"
version = "0.1.0"
description = "Real-time in-game translation for FPS games: screen OCR + teammate voice"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
screen = ["mss>=9.0"]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.9"]
translate = ["httpx>=0.27"]
asr = ["faster-whisper>=1.0"]
audio = ["sounddevice>=0.4"]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fpst = "fpst.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: loads real ONNX models / needs a display; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
